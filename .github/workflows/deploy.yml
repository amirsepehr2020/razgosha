name: Deploy Razgosha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.131.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate start experience
        run: node scripts/integrate-start-experience.mjs

      - name: Integrate paid hints
        run: node scripts/integrate-paid-hints.mjs

      - name: Integrate leaderboard
        run: node scripts/integrate-leaderboard.mjs

      - name: Validate
        run: |
          node --check src/index.js
          node --check src/start-experience.js
          node --check src/case-pagination.js
          node --check src/stage-engine.js
          node --check src/cases.js
          node --check src/score-penalty.js
          node --check src/paid-hints.js
          node --check src/leaderboard.js
          node --check scripts/integrate-start-experience.mjs
          node --check scripts/integrate-paid-hints.mjs
          node --check scripts/integrate-leaderboard.mjs
          npm test

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@${WRANGLER_VERSION}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply my-database-bot --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
