name: Fix Next Case Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime schema compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')
          marker = 'function logEvent(event, details = {}) {'
          helper = '''let mistakeSchemaReady = false;

async function ensureMistakeSchema(env) {
  if (mistakeSchemaReady) return;
  try {
    await env.DB.prepare("ALTER TABLE player_progress ADD COLUMN wrong_guesses INTEGER NOT NULL DEFAULT 0").run();
  } catch (error) {
    const message = String(error?.message || "");
    if (!/duplicate column|already exists/i.test(message)) throw error;
  }
  mistakeSchemaReady = true;
}

'''
          if 'async function ensureMistakeSchema(env)' not in s:
              if marker not in s:
                  raise SystemExit('logEvent marker not found')
              s = s.replace(marker, helper + marker, 1)

          handle_marker = 'async function handleMessage(env, message) {\n  const chatId = message.chat.id;\n  const text = String(message.text || "").trim();'
          handle_new = 'async function handleMessage(env, message) {\n  const chatId = message.chat.id;\n  const text = String(message.text || "").trim();\n\n  await ensureMistakeSchema(env);'
          if handle_marker in s and '  await ensureMistakeSchema(env);' not in s:
              s = s.replace(handle_marker, handle_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Test
        run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --quiet || git commit -m "fix: self-heal missing case mistake column"
          git push