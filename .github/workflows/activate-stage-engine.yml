name: Activate gameplay UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: "!contains(github.event.head_commit.message, 'activate: gameplay UX')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 60-case catalog
        run: python scripts/fix_case_catalog.py
      - name: Harden gameplay UX
        run: python scripts/fix_gameplay_ux_after_integration.py
      - name: Integrate achievement progression
        run: python scripts/integrate_achievements.py
      - name: Repair generated achievement branch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/index.js")
          source = path.read_text(encoding="utf-8")
          marker = 'puzzleKeyboard(finalCase), 850, "🤔");\n          try {'
          replacement = 'puzzleKeyboard(finalCase), 850, "🤔");\n        }\n          try {'
          if marker in source:
              source = source.replace(marker, replacement, 1)
              path.write_text(source, encoding="utf-8")
          PY
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/case-pagination.js
          node --check src/stage-engine.js
          node --check src/cases.js
          npm test
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/cases.js
          git diff --cached --quiet || (git commit -m "activate: gameplay UX" && git push)
