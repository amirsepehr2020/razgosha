name: Activate gameplay UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: "!contains(github.event.head_commit.message, 'activate: gameplay UX')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gameplay UX integration
        run: python scripts/integrate_gameplay_ux.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/case-pagination.js
          node --check src/stage-engine.js
          npm test
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --quiet || (git commit -m "activate: gameplay UX" && git push)
