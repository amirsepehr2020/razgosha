name: Activate gameplay UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: "!contains(github.event.head_commit.message, 'activate: gameplay UX')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 60-case catalog
        run: python scripts/fix_case_catalog.py
      - name: Harden gameplay UX
        run: python scripts/fix_gameplay_ux_after_integration.py
      - name: Integrate account controls
        run: python scripts/integrate_account_controls.py
      - name: Integrate achievement progression
        continue-on-error: true
        run: python scripts/integrate_achievements.py
      - name: Integrate achievement notifications
        continue-on-error: true
        run: python scripts/add_achievement_notifications.py
      - name: Integrate global case mistake scoring
        continue-on-error: true
        run: python scripts/integrate_score_penalty.py
      - name: Integrate paid hints
        run: node scripts/integrate-paid-hints.mjs
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/account-controls.js
          node --check src/case-pagination.js
          node --check src/stage-engine.js
          node --check src/cases.js
          node --check src/score-penalty.js
          node --check src/paid-hints.js
          node --check scripts/integrate-paid-hints.mjs
          npm test
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/cases.js
          git diff --cached --quiet || (git commit -m "activate: gameplay UX" && git push)
