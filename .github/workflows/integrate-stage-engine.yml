name: Integrate stage engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate stage flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')

          if 'from "./stage-engine.js"' not in s:
              s = s.replace(
                  'import { CASES, getCase } from "./cases.js";',
                  'import { CASES, getCase } from "./cases.js";\nimport { getStage, getStageCount, isFinalStage } from "./stage-engine.js";'
              )

          s = s.replace('۱۰ پرونده منتظرتـه', '۶۰ پرونده منتظرتـه')
          s = s.replace('هر ده پرونده فعلی رو حل کن 👑', 'هر ۶۰ پرونده فعلی رو حل کن 👑')

          old = '''function caseKeyboard(c) {\n  return keyboard([\n    ["🔍 سرنخ ۱", "🔍 سرنخ ۲"],\n    ["🔍 سرنخ ۳", "🔍 سرنخ ۴"],\n    [PUZZLE_LABEL],\n    [BACK]\n  ], "سرنخ رو انتخاب کن...");\n}'''
          new = '''function caseKeyboard(c, stage = null) {\n  const clues = stage?.clues || c.clues || [];\n  const rows = [];\n  for (let i = 0; i < Math.min(4, clues.length); i += 2) {\n    const row = [];\n    row.push(`🔍 سرنخ ${i + 1}`);\n    if (clues[i + 1]) row.push(`🔍 سرنخ ${i + 2}`);\n    rows.push(row);\n  }\n  if (stage?.type === "puzzle" || !stage) rows.push([PUZZLE_LABEL]);\n  else rows.push(["➡️ رفتن به مرحله بعد"]);\n  rows.push([BACK]);\n  return keyboard(rows, stage ? `مرحله ${stage.id} رو بررسی کن...` : "سرنخ رو انتخاب کن...");\n}'''
          if old in s:
              s = s.replace(old, new)

          old = '''async function getActiveCase(env, playerId) {\n  const row = await env.DB.prepare("SELECT case_id FROM player_progress WHERE player_id=? AND solved=0 ORDER BY updated_at DESC, id DESC LIMIT 1").bind(playerId).first();\n  return row ? getCase(row.case_id) : null;\n}'''
          new = '''async function getActiveCase(env, playerId) {\n  const row = await env.DB.prepare("SELECT case_id, current_step FROM player_progress WHERE player_id=? AND solved=0 ORDER BY updated_at DESC, id DESC LIMIT 1").bind(playerId).first();\n  if (!row) return null;\n  const c = getCase(row.case_id);\n  return c ? { ...c, currentStep: Number(row.current_step || 0) } : null;\n}'''
          if old in s:
              s = s.replace(old, new)

          old = '''  return sendMessage(env, chatId, `📂 ${c.title}\\n\\n${c.intro}\\n\\n👥 مظنون‌ها:\\n${c.suspects.map((s, i) => `${i + 1}. ${s}`).join("\\n")}\\n\\nخب کارآگاه... سرنخ‌ها رو یکی‌یکی ببین. عجله نکن؛ یه جزئیات کوچیک ممکنه کل ماجرا رو عوض کنه 👀`, caseKeyboard(c), 1100, "🕵️");'''
          new = '''  const progress = await env.DB.prepare("SELECT current_step FROM player_progress WHERE player_id=? AND case_id=?").bind(player.id, c.id).first();\n  const stage = getStage(c, Number(progress?.current_step || 0));\n  const stageCount = getStageCount(c);\n  const stageText = stageCount > 1 ? `\\n\\n🧩 مرحله ${stage.id} از ${stageCount} — ${stage.title}` : "";\n  return sendMessage(env, chatId, `📂 ${c.title}${stageText}\\n\\n${c.intro}\\n\\n👥 مظنون‌ها:\\n${c.suspects.map((s, i) => `${i + 1}. ${s}`).join("\\n")}\\n\\nخب کارآگاه... این مرحله رو با دقت بررسی کن. 👀`, caseKeyboard(c, stage), 1100, "🕵️");'''
          if old in s:
              s = s.replace(old, new)

          old = '''  if (activeCase) {\n    const clueIndex = CLUE_LABELS.indexOf(text);\n    if (clueIndex >= 0 && activeCase.clues[clueIndex]) {\n      return sendMessage(env, chatId, `🔍 سرنخ ${clueIndex + 1}\\n\\n${activeCase.clues[clueIndex]}\\n\\nحواست جمع باشه... این جزئیات ممکنه بعداً به کارت بیاد 👀`, caseKeyboard(activeCase), 900, "🔍");\n    }\n    if (text === PUZZLE_LABEL) {\n      return sendMessage(env, chatId, `🧩 خب... رسیدیم به اصل ماجرا!\\n\\n${activeCase.question}\\n\\nفقط یکی از این جواب‌ها با شواهد جور درمیاد.`, puzzleKeyboard(activeCase), 950, "🧩");\n    }'''
          new = '''  if (activeCase) {\n    const stage = getStage(activeCase, activeCase.currentStep);\n    const stageCount = getStageCount(activeCase);\n    const stageClues = stage?.clues || activeCase.clues || [];\n    const clueIndex = CLUE_LABELS.indexOf(text);\n    if (clueIndex >= 0 && stageClues[clueIndex]) {\n      return sendMessage(env, chatId, `🔍 مرحله ${stage?.id || 1} — سرنخ ${clueIndex + 1}\\n\\n${stageClues[clueIndex]}\\n\\nحواست جمع باشه... این جزئیات ممکنه بعداً به کارت بیاد 👀`, caseKeyboard(activeCase, stage), 900, "🔍");\n    }\n    if (text === "➡️ رفتن به مرحله بعد" && stage && !isFinalStage(activeCase, activeCase.currentStep)) {\n      const nextStep = activeCase.currentStep + 1;\n      await env.DB.prepare("UPDATE player_progress SET current_step=?, updated_at=? WHERE player_id=? AND case_id=? AND solved=0").bind(nextStep, new Date().toISOString(), player.id, activeCase.id).run();\n      const nextStage = getStage(activeCase, nextStep);\n      return sendMessage(env, chatId, `🧩 مرحله ${nextStage.id} از ${stageCount}\\n\\n${nextStage.title}\\n\\nسرنخ‌ها رو بررسی کن؛ بعد می‌ریم سراغ تصمیم بعدی.`, caseKeyboard(activeCase, nextStage), 900, "🧩");\n    }\n    if (text === PUZZLE_LABEL) {\n      const puzzle = stage?.type === "puzzle" ? stage : activeCase;\n      return sendMessage(env, chatId, `🧩 خب... رسیدیم به اصل ماجرا!\\n\\n${puzzle.question}\\n\\nفقط یکی از این جواب‌ها با شواهد جور درمیاد.`, puzzleKeyboard(puzzle), 950, "🧩");\n    }'''
          if old in s:
              s = s.replace(old, new)

          old = '''    const index = answerIndex(activeCase, text);\n    if (index >= 0) {\n      if (index !== activeCase.answer) {\n        return sendMessage(env, chatId, `❌ نه، این یکی با شواهد جور درنمیاد.\\n\\n${activeCase.question}\\n\\nیه بار دیگه سرنخ‌ها رو مرور کن؛ عجله نکن کارآگاه 😉`, puzzleKeyboard(activeCase), 850, "🤔");\n      }'''
          new = '''    const puzzle = stage?.type === "puzzle" ? stage : activeCase;\n    const index = answerIndex(puzzle, text);\n    if (index >= 0) {\n      if (index !== puzzle.answer) {\n        return sendMessage(env, chatId, `❌ نه، این یکی با شواهد جور درنمیاد.\\n\\n${puzzle.question}\\n\\nیه بار دیگه سرنخ‌ها رو مرور کن؛ عجله نکن کارآگاه 😉`, puzzleKeyboard(puzzle), 850, "🤔");\n      }\n      if (stage && !isFinalStage(activeCase, activeCase.currentStep)) {\n        const nextStep = activeCase.currentStep + 1;\n        await env.DB.prepare("UPDATE player_progress SET current_step=?, updated_at=? WHERE player_id=? AND case_id=? AND solved=0").bind(nextStep, new Date().toISOString(), player.id, activeCase.id).run();\n        const nextStage = getStage(activeCase, nextStep);\n        return sendMessage(env, chatId, `✅ مرحله ${stage.id} رو درست تحلیل کردی!\\n\\n🧩 مرحله ${nextStage.id} از ${stageCount} — ${nextStage.title}\\n\\nحالا شواهد جدید رو بررسی کن.`, caseKeyboard(activeCase, nextStage), 900, "🎉");\n      }'''
          if old in s:
              s = s.replace(old, new)

          old = '''        return sendMenu(env, chatId, `${activeCase.success}\\n\\n💰 +${activeCase.reward} امتیاز\\n\\n📁 پرونده ثبت شد. پرونده بعدی باز شد 🔓`, "🎉");'''
          new = '''        return sendMenu(env, chatId, `${activeCase.success}\\n\\n💰 +${activeCase.reward} امتیاز\\n\\n📁 پرونده ثبت شد. پرونده بعدی باز شد 🔓`, "🎉");'''
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check src/index.js
          node --check src/stage-engine.js
          node --check src/cases.js
          node --check src/advanced-cases.js
          node --check src/case-catalog.js
          npm test

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if git diff --cached --quiet; then
            echo "No integration changes"
          else
            git commit -m "feat: enable multi-stage detective gameplay"
            git push
          fi
